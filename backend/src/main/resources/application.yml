spring:
  application:
    name: inventory-import

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: 10
      # An import holds a connection per chunk, not for its whole run, but a large file still
      # keeps the pool busy for minutes. Leak detection would only produce false positives.
      leak-detection-threshold: 0

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    # Off by default in Boot, but stated explicitly: a view must never hold a DB connection.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000

  flyway:
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Large enough for a multi-million-row export. The upload is streamed to a temp file, so
      # this bounds disk rather than heap.
      max-file-size: 512MB
      max-request-size: 513MB
      file-size-threshold: 0B

server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB

logging:
  level:
    # DEBUG additionally logs why each individual row was rejected.
    com.ablsoft.inventory: INFO
