spring:
  application:
    name: inventory-import

  threads:
    virtual:
      # An import holds its request for the whole file, so serving requests on virtual threads
      # keeps a long upload from occupying one of a small pool of platform threads.
      enabled: true

  servlet:
    multipart:
      # Spring parses MB as binary, so 15MB is exactly 15 MiB. The container rejects an oversized
      # upload before any of our code runs.
      max-file-size: 15MB
      max-request-size: 16MB
      # 0B streams every uploaded part straight to a temp file instead of buffering it in the heap,
      # which matters because POI needs headroom to evaluate formulas.
      file-size-threshold: 0B

server:
  port: 8080
  tomcat:
    # When Tomcat rejects an oversized upload it must still drain the rest of the body, or the
    # client sees a connection reset instead of our 400.
    max-swallow-size: 20MB

logging:
  level:
    # DEBUG additionally logs why each individual row was rejected.
    com.ablsoft.inventory: INFO
